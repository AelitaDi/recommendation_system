{% extends 'films/base.html' %}
{% block title %}Создание актера{% endblock %}
{% block content %}
<div class="container">
    <h1 class="mt-5">Создайте актера:</h1>
    <form method="post" enctype="multipart/form-data" class="needs-validation" novalidate>
        {% csrf_token %}
        {{ form.non_field_errors }}
        {{ form.as_p }}
        <button type="submit" class="btn btn-primary mt-3">
            {% if object %}
            Сохранить изменения
            {% else %}
            Добавить актера
            {% endif %}
        </button>
        <a type="button" href="{% url 'films:actor_list' %}" class="btn btn-secondary mt-3">Отмена</a>
        {% if object %}
        <a type="button" class="btn btn-outline-danger mt-3" href="{% url 'films:actor_delete' object.pk %}">Удалить</a>
        {% endif %}
    </form>
</div>
{% endblock %}
