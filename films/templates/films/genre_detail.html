{% extends 'films/base.html' %}
{% block title %}Жанр{% endblock %}
{% block content %}
<div class="container">
    <h3 class="mt-3 mb-3">
        {{ object.name }}:
    </h3>
    <div class="col">
        <ul class="list-group">
            <li class="list-group-item d-flex justify-content-between align-items-center">
                <p>
                    Наименование:
                </p>
                <p>
                    {{ object.name }}
                </p>
            </li>
        </ul>
    </div>
    <div class="d-grid gap-2 d-md-flex justify-content-md-end mt-3">
        <a href="{% url 'films:genre-list' %}" class="btn btn-outline-secondary">
            К списку жанров
        </a>
        {% if user.is_staff %}
        <a href="{% url 'films:genre_update' object.pk %}" class="btn btn-outline-secondary">
            Редактировать
        </a>
        <a href="{% url 'films:genre_delete' object.pk %}" class="btn btn-outline-danger">
            Удалить
        </a>
        {% endif %}
    </div>
</div>
{% endblock %}
