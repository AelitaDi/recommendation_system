{% extends 'films/base.html' %}
{% block title %}Авторизация{% endblock %}
{% block content %}
<div class="container">
    <h1 class="mt-5 mb-5">Авторизация</h1>
    <form method="post" enctype="multipart/form-data" class="needs-validation mb-1" novalidate>
        {% csrf_token %}
        {{ form.non_field_errors }}
        {{ form.as_p }}
        <button type="submit" class="btn btn-primary mt-3">Войти</button>
    </form>
</div>
{% endblock %}
